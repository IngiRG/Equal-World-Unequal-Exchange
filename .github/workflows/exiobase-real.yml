name: Build empirical EXIOBASE EWA
on:
  workflow_dispatch:
    inputs:
      year:
        description: "EXIOBASE core year"
        required: true
        default: "2020"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt pymrio pyyaml
      - run: python scripts/fetch_world_bank.py --year "${{ inputs.year }}"
      - run: python scripts/fetch_exiobase.py --year "${{ inputs.year }}" --format ixi
      - run: python scripts/build_exiobase_results.py --year "${{ inputs.year }}" --archive "data/raw/exiobase/IOT_${{ inputs.year }}_ixi.zip"
      - name: Commit empirical outputs and source metadata
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/external/world_bank site/data/real
          git diff --cached --quiet || git commit -m "data: build empirical EXIOBASE EWA ${{ inputs.year }}"
          git push
