name: Test EWA model
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: pip install -r requirements.txt
      - run: pytest
      - run: python scripts/build_results.py
      - name: Verify generated results are reproducible
        run: git diff --exit-code -- site/data || (echo "Generated results differ. Run python scripts/build_results.py and commit outputs." && exit 1)
