[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "equal-world-analysis"
version = "0.1.0"
description = "Reference implementation of Equal World Analysis"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "pandas>=2.1", "requests>=2.31"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
